<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Pen Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="pen" title="Pen">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12a1 1 0 000-1.42zM5.21 20c-.58 0-1.05-.47-1.05-1.05v-2.26l8.46-8.46 2.31 2.31L6.26 20H5.21z"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="highlighter" title="Highlighter">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M18.5 1.15c-.53 0-1.04.2-1.41.59l-2.29 2.3 7.56 7.56 2.29-2.3c.78-.78.78-2.05 0-2.83l-4.75-4.75c-.39-.38-.9-.57-1.4-.57zm-2.83 2.3L7.06 12.06 5.64 16.97 10.53 18.4l8.61-8.61-3.47-6.34z"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="Eraser">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.17 20.1c.39.4.9.59 1.41.59 1.03 0 1.99-.4 2.72-1.12l11.11-11.12c.78-.78.78-2.05 0-2.83l-2.58-2.59C17.12 2.2 16.12 3 15.14 3zm0 2.12l2.59 2.59L6.61 18.83 4.03 16.24 15.14 5.12z"/>
                </svg>
            </button>
        </div>
        
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#ff0000" title="Color Picker">
            <input type="range" id="sizeSlider" min="1" max="50" value="3" title="Brush Size">
            <span id="sizeValue">3</span>
        </div>
        
        <div class="tool-group">
            <button class="action-btn" id="clearBtn" title="Clear All">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <button class="action-btn" id="undoBtn" title="Undo">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                </svg>
            </button>
            <button class="action-btn" id="redoBtn" title="Redo">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
                </svg>
            </button>
        </div>
        
        <div class="tool-group">
            <button class="action-btn" id="saveBtn" title="Save Image">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Canvas Container -->
    <div class="canvas-container">
        <canvas id="drawingCanvas"></canvas>
    </div>
    
    <!-- Instructions Panel -->
    <div class="instructions" id="instructions">
        <h3>How to Use:</h3>
        <ul>
            <li><strong>Pen:</strong> Draw freehand lines</li>
            <li><strong>Highlighter:</strong> Semi-transparent highlighting</li>
            <li><strong>Eraser:</strong> Remove strokes</li>
            <li><strong>Color Picker:</strong> Choose your color</li>
            <li><strong>Size Slider:</strong> Adjust brush size</li>
            <li><strong>Ctrl+Z:</strong> Undo | <strong>Ctrl+Y:</strong> Redo</li>
        </ul>
        <button id="closeInstructions">✕</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
